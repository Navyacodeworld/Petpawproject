<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pet Paw — Login / Register</title>
  <meta name="description" content="Login or create your Pet Paw account to manage your furry friend's profile."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --pink-dark: #FF8FAB;
      --brown: #C8956C;
      --brown-dark: #A0714F;
      --text: #3D2C2C;
      --text-light: #7A6060;
      --border: #EEDDD0;
      --white: #FFFFFF;
      --light-gray: #F5F0EC;
      --transition: 0.3s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #FDE9D9 0%, #FCE4EC 50%, #E3F2FD 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
    }

    /* Floating paw prints */
    .paw-float {
      position: fixed;
      font-size: 2rem;
      opacity: 0.1;
      pointer-events: none;
      animation: floatPaw 4s ease-in-out infinite;
      color: var(--brown);
    }
    .paw-1 { top: 8%; left: 5%; animation-delay: 0s; font-size: 2.5rem; }
    .paw-2 { top: 20%; right: 8%; animation-delay: 0.8s; font-size: 1.8rem; }
    .paw-3 { bottom: 15%; left: 12%; animation-delay: 1.4s; font-size: 3rem; }
    .paw-4 { bottom: 25%; right: 6%; animation-delay: 0.3s; font-size: 2rem; }

    @keyframes floatPaw {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(15deg); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== AUTH CARD ===== */
    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.6s ease both;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--pink-dark), var(--brown));
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255,143,171,0.35);
      margin-bottom: 12px;
    }

    .brand-icon i { font-size: 1.8rem; color: white; }

    .brand h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: var(--text);
      line-height: 1.1;
    }

    .brand p {
      color: var(--text-light);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(109, 89, 87, 0.12);
      overflow: hidden;
    }

    /* ===== TABS ===== */
    .auth-tabs {
      display: flex;
      border-bottom: 1.5px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: transparent;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-light);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }

    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -1.5px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(to right, var(--pink-dark), var(--brown));
      border-radius: 2px 2px 0 0;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .tab-btn.active {
      color: var(--brown);
    }

    .tab-btn.active::after { opacity: 1; }

    /* ===== PANELS ===== */
    .auth-panel {
      display: none;
      padding: 32px 36px;
    }

    .auth-panel.active { display: block; }

    /* ===== FORM FIELDS ===== */
    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--brown);
      margin-bottom: 7px;
    }

    .field label i { margin-right: 5px; }

    .field input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .field input:focus {
      border-color: var(--pink-dark);
      box-shadow: 0 0 0 3px rgba(255,143,171,0.15);
    }

    /* ===== PET TYPE ===== */
    .pet-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pet-opt {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid var(--border);
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--white);
    }

    .pet-opt i {
      font-size: 1.6rem;
      color: var(--text-light);
      display: block;
      margin-bottom: 5px;
      transition: color var(--transition);
    }

    .pet-opt span {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-light);
      transition: color var(--transition);
    }

    .pet-opt:hover { border-color: var(--pink-dark); transform: translateY(-2px); }

    .pet-opt.selected {
      border-color: var(--brown);
      background: linear-gradient(135deg, rgba(200,149,108,0.07), rgba(255,143,171,0.07));
    }

    .pet-opt.selected i, .pet-opt.selected span { color: var(--brown); }

    /* ===== BUTTONS ===== */
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--pink-dark), var(--brown));
      color: white;
      border: none;
      border-radius: 50px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition);
      box-shadow: 0 6px 20px rgba(255,143,171,0.3);
      position: relative;
      overflow: hidden;
    }

    .auth-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      transition: left 0.4s ease;
    }

    .auth-btn:hover::before { left: 100%; }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,143,171,0.4); }

    /* ===== ERROR / SUCCESS MESSAGES ===== */
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .msg.error { background: rgba(255,100,100,0.1); color: #c0392b; border: 1px solid rgba(255,100,100,0.2); display: flex; }
    .msg.success { background: rgba(76,175,80,0.1); color: #2e7d32; border: 1px solid rgba(76,175,80,0.2); display: flex; }
    .msg.hidden { display: none !important; }

    .switch-link {
      text-align: center;
      margin-top: 16px;
      font-size: 0.88rem;
      color: var(--text-light);
    }

    .switch-link a {
      color: var(--brown);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .switch-link a:hover { text-decoration: underline; }

    /* ===== BACK LINK ===== */
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      justify-content: center;
      margin-top: 20px;
      transition: color var(--transition);
    }

    .back-link:hover { color: var(--brown); }

    /* ===== FLOATING GLASSMORPHISM NAVBAR ===== */
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 40px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(109, 89, 87, 0.08);
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .navbar.scrolled {
      top: 10px;
      padding: 10px 35px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 35px rgba(109, 89, 87, 0.12);
    }

    .navbar-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 10px;
    }

    .navbar-logo img {
      height: 50px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: transform 0.3s;
    }

    .navbar-logo:hover img {
      transform: scale(1.08) rotate(-3deg);
    }

    .navbar-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .navbar-links a {
      color: #6D5957;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar-links a::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 0;
      height: 3px;
      background: #FFB7B2;
      border-radius: 2px;
      transform: translateX(-50%);
      transition: width 0.3s ease;
    }

    .navbar-links a:hover::after { width: 18px; }
    .navbar-links a:hover { color: #ff9e96; background: rgba(255, 183, 178, 0.08); }

    .navbar-links a.nav-active {
      background: #FFB7B2;
      color: #6D5957 !important;
      box-shadow: 0 4px 14px rgba(255, 183, 178, 0.35);
      font-weight: 700;
    }

    .navbar-links a.nav-active::after { display: none; }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 24px;
      height: 16px;
      cursor: pointer;
      z-index: 1001;
    }

    .hamburger span {
      display: block;
      width: 100%;
      height: 2.5px;
      background: #6D5957;
      border-radius: 2px;
      transition: all 0.3s ease-in-out;
      transform-origin: left center;
    }

    .hamburger.open span:nth-child(1) { transform: rotate(45deg); }
    .hamburger.open span:nth-child(2) { width: 0%; opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg); }

    .mobile-menu {
      position: fixed;
      top: 95px;
      left: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      z-index: 999;
      box-shadow: 0 16px 40px rgba(109, 89, 87, 0.12);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255, 183, 178, 0.2);
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .mobile-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .mobile-menu a {
      color: #6D5957;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 18px;
      border-radius: 14px;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu a:hover { background: rgba(255, 183, 178, 0.12); color: #ff9e96; }

    .mobile-menu a.nav-active {
      background: #FFB7B2;
      color: #6D5957 !important;
      justify-content: center;
      border-radius: 50px;
    }

    @media (max-width: 768px) {
      .navbar-links { display: none; }
      .hamburger { display: flex; }
    }

    @media (max-width: 480px) {
      .navbar { width: calc(100% - 24px); padding: 8px 16px; }
    }
  </style>
</head>
<body>

  <!-- ===== GLASSMORPHISM NAVBAR ===== -->
  <nav class="navbar" id="mainNavbar">
    <a href="index.html" class="navbar-logo">
      <img src="pet_logo.png" alt="Pet Paw Logo">
    </a>
    <div class="navbar-links">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#services">Services</a>
      <a href="index.html#contact">Contact</a>
      <a href="login.html" class="nav-active"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
    </div>
    <div class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#home" onclick="toggleMenu()"><i class="fa-solid fa-house"></i> Home</a>
    <a href="index.html#about" onclick="toggleMenu()"><i class="fa-solid fa-paw"></i> About</a>
    <a href="index.html#services" onclick="toggleMenu()"><i class="fa-solid fa-hand-holding-heart"></i> Services</a>
    <a href="index.html#contact" onclick="toggleMenu()"><i class="fa-solid fa-envelope"></i> Contact</a>
    <a href="login.html" class="nav-active" onclick="toggleMenu()"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
  </div>

  <!-- Floating Paws -->
  <div class="paw-float paw-1"><i class="fa-solid fa-paw"></i></div>
  <div class="paw-float paw-2"><i class="fa-solid fa-paw"></i></div>
  <div class="paw-float paw-3"><i class="fa-solid fa-paw"></i></div>
  <div class="paw-float paw-4"><i class="fa-solid fa-paw"></i></div>

  <div class="auth-wrapper">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-paw"></i></div>
      <h1>Pet Paw</h1>
      <p>Your pet's happiness, organised.</p>
    </div>

    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
        <button class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>

      <!-- ===== LOGIN PANEL ===== -->
      <div class="auth-panel active" id="loginPanel">
        <div class="msg hidden" id="loginMsg"></div>

        <div class="field">
          <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
        </div>

        <div class="field">
          <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password"/>
        </div>

        <button class="auth-btn" id="loginBtn" onclick="handleLogin()">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>

        <div class="switch-link">
          New here? <a onclick="switchTab('register')">Create an account</a>
        </div>
      </div>

      <!-- ===== REGISTER PANEL ===== -->
      <div class="auth-panel" id="registerPanel">
        <div class="msg hidden" id="registerMsg"></div>

        <div class="field">
          <label for="regName"><i class="fas fa-user"></i> Your Name</label>
          <input type="text" id="regName" placeholder="e.g. Priya, Arjun..." maxlength="40"/>
        </div>

        <div class="field">
          <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email"/>
        </div>

        <div class="field">
          <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="regPassword" placeholder="Choose a password" autocomplete="new-password"/>
        </div>

        <div class="field">
          <label><i class="fas fa-paw"></i> Pet's Name</label>
          <input type="text" id="regPetName" placeholder="e.g. Bruno, Luna, Max..." maxlength="30"/>
        </div>

        <div class="field">
          <label><i class="fas fa-dog"></i> Pet Type</label>
          <div class="pet-row">
            <div class="pet-opt" id="optDog" onclick="selectPetType('dog')">
              <i class="fa-solid fa-dog"></i>
              <span>Dog</span>
            </div>
            <div class="pet-opt" id="optCat" onclick="selectPetType('cat')">
              <i class="fa-solid fa-cat"></i>
              <span>Cat</span>
            </div>
          </div>
        </div>

        <button class="auth-btn" id="registerBtn" onclick="handleRegister()">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

        <div class="switch-link">
          Already have an account? <a onclick="switchTab('login')">Login</a>
        </div>
      </div>

    </div>

    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

  </div>

  <script>
    // =====================================================
    //   PET PAW — AUTH (localStorage based)
    // =====================================================

    const DB_KEY   = 'petpaw_users';   // Array of user objects
    const SESS_KEY = 'petpaw_session'; // Current logged-in email

    /* ---- Helpers ---- */
    function getUsers() {
      return JSON.parse(localStorage.getItem(DB_KEY) || '[]');
    }

    function saveUsers(users) {
      localStorage.setItem(DB_KEY, JSON.stringify(users));
    }

    function setSession(email) {
      localStorage.setItem(SESS_KEY, email);
    }

    function showMsg(elId, type, text) {
      const el = document.getElementById(elId);
      el.className = 'msg ' + type;
      el.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${text}`;
    }

    function hideMsg(elId) {
      document.getElementById(elId).className = 'msg hidden';
    }

    /* ---- If already logged in, redirect ---- */
    (function checkSession() {
      const session = localStorage.getItem(SESS_KEY);
      if (!session) return;
      const users = getUsers();
      const user  = users.find(u => u.email === session);
      if (!user) return;
      // Already logged in → go to dashboard or profile
      window.location.href = user.profileComplete ? 'dashboard.html' : 'profile.html';
    })();

    /* ---- Tab switching ---- */
    let selectedPetType = '';

    function switchTab(tab) {
      document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
      document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
      document.getElementById('loginTabBtn').classList.toggle('active', tab === 'login');
      document.getElementById('registerTabBtn').classList.toggle('active', tab === 'register');
      hideMsg('loginMsg');
      hideMsg('registerMsg');
    }

    function selectPetType(type) {
      selectedPetType = type;
      document.getElementById('optDog').classList.toggle('selected', type === 'dog');
      document.getElementById('optCat').classList.toggle('selected', type === 'cat');
    }

    /* ---- LOGIN ---- */
    function handleLogin() {
      const email    = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showMsg('loginMsg', 'error', 'Please enter your email and password.');
        return;
      }

      const users = getUsers();
      const user  = users.find(u => u.email === email && u.password === password);

      if (!user) {
        showMsg('loginMsg', 'error', 'Invalid email or password. Please try again.');
        return;
      }

      showMsg('loginMsg', 'success', 'Welcome back, ' + user.name + '!');
      setSession(email);

      // Restore user data to localStorage keys the rest of the app uses
      localStorage.setItem('petName', user.petName);
      localStorage.setItem('petType', user.petType);

      setTimeout(() => {
        window.location.href = user.profileComplete ? 'dashboard.html' : 'profile.html';
      }, 600);
    }

    /* ---- REGISTER ---- */
    function handleRegister() {
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;
      const petName  = document.getElementById('regPetName').value.trim();

      if (!name || !email || !password || !petName || !selectedPetType) {
        showMsg('registerMsg', 'error', 'Please fill in all fields and select a pet type.');
        return;
      }

      if (password.length < 6) {
        showMsg('registerMsg', 'error', 'Password must be at least 6 characters.');
        return;
      }

      const users = getUsers();
      if (users.find(u => u.email === email)) {
        showMsg('registerMsg', 'error', 'An account with this email already exists.');
        return;
      }

      const newUser = {
        name,
        email,
        password,
        petName,
        petType: selectedPetType,
        profileComplete: false,
        createdAt: Date.now()
      };

      users.push(newUser);
      saveUsers(users);
      setSession(email);

      // Seed localStorage keys for profile.html & dashboard.html
      localStorage.setItem('petName', petName);
      localStorage.setItem('petType', selectedPetType);

      showMsg('registerMsg', 'success', 'Account created! Setting up your profile...');

      setTimeout(() => {
        window.location.href = 'profile.html';
      }, 800);
    }

    /* ---- Allow Enter key ---- */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const loginActive = document.getElementById('loginPanel').classList.contains('active');
      if (loginActive) handleLogin(); else handleRegister();
    });
  </script>

  <script>
    /* ===== NAVBAR ===== */
    const navbar = document.getElementById('mainNavbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 30);
    });

    function toggleMenu() {
      document.getElementById('mobileMenu').classList.toggle('open');
      document.getElementById('hamburger').classList.toggle('open');
    }
  </script>

</body>
</html>
